# Sitio de la aplicacion: HTTP en el 80 y HTTPS en el 443 del contenedor.
# Las rutas del certificado (SSL_CERT_FILE, SSL_KEY_FILE) salen del entorno;
# si no existen, el entrypoint genera un certificado autofirmado.

<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    # Redireccion a SITE_URL (HTTPS_REDIRECT=true): la escribe el entrypoint.
    IncludeOptional /etc/apache2/mlsurvey-http-redirect.conf
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    SSLEngine on
    SSLCertificateFile    ${SSL_CERT_FILE}
    SSLCertificateKeyFile ${SSL_KEY_FILE}
</VirtualHost>

# Host que pide el certificado digital (CLIENTCERT_ENABLED=true): lo escribe
# el entrypoint, en su propio puerto, ver README.
IncludeOptional /etc/apache2/mlsurvey-clientcert.conf

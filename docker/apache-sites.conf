# HTTP: redirige a HTTPS, donde se pide el certificado de cliente. La URL de
# destino sale de SITE_URL; el entrypoint define HTTPS_REDIRECT si es https://
# y no se ha desactivado (HTTPS_REDIRECT=false, p. ej. con un proxy TLS que
# llega por aqui).
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <IfDefine HTTPS_REDIRECT>
        # 302 y no 301: el navegador no lo guarda, por si cambia el puerto.
        Redirect / ${HTTPS_REDIRECT_URL}
    </IfDefine>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# HTTPS del sitio: las consultas, los resultados y la verificacion de la
# cuenta. No pide certificado.
<VirtualHost *:443>
    DocumentRoot /var/www/html

    SSLEngine on
    # Certificado del servidor: el entrypoint genera uno autofirmado si no
    # hay uno montado en /etc/ssl/mlsurvey.
    SSLCertificateFile    /etc/ssl/mlsurvey/server.crt
    SSLCertificateKeyFile /etc/ssl/mlsurvey/server.key

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# HTTPS del registro y la votacion (registration_url): el unico que pide el
# certificado electronico (DNIe, FNMT, empleado publico...), con el que hay
# que identificarse al registrarse y al votar. El navegador solo lo pide al
# negociar el TLS, por eso va en un puerto (o, en produccion, un nombre)
# aparte: asi no se pide al ver las consultas. Sirve la misma aplicacion; el
# registro y la votacion se hacen aqui, y el navegador pide el certificado al
# entrar. Sin un
# certificado valido, la aplicacion avisa y vuelve al sitio (puerto 443).
Listen 444
<VirtualHost *:444>
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/mlsurvey/server.crt
    SSLCertificateKeyFile /etc/ssl/mlsurvey/server.key

    # CA admitidas para el certificado de cliente: las cualificadas de la TSL
    # espanola, generadas por buildclientca.php (ver entrypoint.sh). Su lista
    # se manda al navegador, que solo ofrece los certificados emitidos por ellas.
    SSLCACertificateFile /etc/ssl/mlsurvey/client_ca.pem
    # Al conectar (sin renegociar, que TLS 1.3 y HTTP/2 no admiten).
    # optional_no_ca: un certificado caducado o de otra CA no corta la
    # conexion con un error del navegador; llega como FAILED en
    # SSL_CLIENT_VERIFY y la aplicacion explica el motivo.
    SSLVerifyClient optional_no_ca
    SSLVerifyDepth 4
    # SSL_CLIENT_VERIFY y SSL_CLIENT_CERT para PHP (utils/clientcert.php).
    SSLOptions +StdEnvVars +ExportCertData

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# El .htaccess del proyecto hace el enrutado (index.php?view=...), hace falta AllowOverride.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Pool de workers = pool de conexiones a la base de datos: cada worker de prefork
# mantiene una conexion persistente (ver utils/dbutils.php). Los valores salen del
# entorno (docker-compose.yml / entrypoint.sh). DB_MAX_CONNECTIONS debe ser mayor
# que APACHE_MAX_WORKERS.
<IfModule mpm_prefork_module>
    # Workers (y conexiones) precalentados para absorber el inicio de un pico.
    StartServers            ${APACHE_START_WORKERS}
    MinSpareServers         ${APACHE_START_WORKERS}
    MaxSpareServers         ${APACHE_MAX_SPARE_WORKERS}
    ServerLimit             ${APACHE_MAX_WORKERS}
    MaxRequestWorkers       ${APACHE_MAX_WORKERS}
    # Reciclar workers de vez en cuando evita que crezca la memoria de PHP.
    MaxConnectionsPerChild  10000
</IfModule>
# Cola del socket: las peticiones que excedan el pool esperan en vez de rechazarse.
ListenBacklog ${APACHE_LISTEN_BACKLOG}
# Un worker en keep-alive retiene su conexion sin usarla; se libera rapido.
KeepAliveTimeout 2
Timeout 60

# Codigo del servidor: se incluye desde index.php, nunca debe servirse por HTTP.
<DirectoryMatch "^/var/www/html/(config|include|utils|ifaces|views)">
    Require all denied
</DirectoryMatch>

# Los ficheros subidos se sirven, pero nunca se ejecutan.
<Directory /var/www/html/files>
    php_admin_flag engine off
    Options -Indexes -ExecCGI
    AllowOverride None
    # Y nunca se interpretan como paginas del sitio: lo que no sea PDF se
    # descarga, y el navegador no puede adivinar otro tipo.
    ForceType application/octet-stream
    Header set Content-Disposition attachment
    Header set X-Content-Type-Options nosniff
    <FilesMatch "\.[Pp][Dd][Ff]$">
        ForceType application/pdf
        Header unset Content-Disposition
    </FilesMatch>
</Directory>

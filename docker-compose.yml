services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    # Dimensionado para el pool de conexiones persistentes de la web (un unico cliente):
    # max_connections > APACHE_MAX_WORKERS, con margen para el entrypoint y administracion.
    command:
      - --max-connections=${DB_MAX_CONNECTIONS:-200}
      - --thread-cache-size=${APACHE_MAX_WORKERS:-150}
      - --back-log=1024
      - --max-connect-errors=100000
      - --skip-name-resolve
    ports:
      - 3307:3306
    environment:
      MARIADB_DATABASE: ${DB_NAME:-mlsurvey}
      MARIADB_USER: ${DB_USER:-mlsurvey}
      MARIADB_PASSWORD: ${DB_PASSWORD:-mlsurvey}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mlsurvey-root}
    volumes:
      - db_data:/var/lib/mysql
      # Se carga solo la primera vez, cuando el volumen db_data esta vacio.
      - ./modelo_datos.sql:/docker-entrypoint-initdb.d/01-modelo_datos.sql:ro
      - ./test-data.sql:/docker-entrypoint-initdb.d/02-test_data.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Postfix de desarrollo. Acepta el correo autenticado de la aplicacion
  # y lo entrega TODO a un unico buzon local: no tiene salida a internet,
  # asi que un destinatario mal escrito en una prueba no puede acabar en
  # el buzon de nadie.
  #
  #   docker compose exec mail mlmail        lista los mensajes
  #   docker compose exec mail mlmail 1      muestra el primero
  #
  # Para usar un servidor real, rellena EMAIL_* en .env y este servicio
  # deja de pintar nada.
  mail:
    build:
      context: .
      dockerfile: docker/mail/Dockerfile
    restart: unless-stopped
    environment:
      # Cualquier usuaria vale; lo que se comprueba es la clave, y tiene
      # que coincidir con EMAIL_PASSWORD del servicio web.
      MAIL_PASSWORD: ${EMAIL_PASSWORD:-mlsurvey}
    volumes:
      # El buzon sobrevive a un recreado del contenedor.
      - mail_data:/var/mail/catchall
    # El puerto 587 no se publica: solo lo usa el contenedor web por la
    # red interna de compose.
    healthcheck:
      test: ["CMD", "sh", "-c", "postfix status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mlsurvey}
      DB_USER: ${DB_USER:-mlsurvey}
      DB_PASSWORD: ${DB_PASSWORD:-mlsurvey}
      DB_PREFIX: ${DB_PREFIX:-}
      # Pool de workers/conexiones. Mantener por debajo de DB_MAX_CONNECTIONS.
      APACHE_MAX_WORKERS: ${APACHE_MAX_WORKERS:-150}
      APACHE_START_WORKERS: ${APACHE_START_WORKERS:-25}
      APACHE_MAX_SPARE_WORKERS: ${APACHE_MAX_SPARE_WORKERS:-75}
      APACHE_LISTEN_BACKLOG: ${APACHE_LISTEN_BACKLOG:-1024}
      # URL publica del sitio, tal como la ven las participantes. Los enlaces
      # de los correos se construyen con ella, no con la cabecera Host.
      SITE_URL: ${SITE_URL:-http://localhost:${WEB_PORT:-8080}/}
      # 0: error, 1: warn, 2: info, 3: debug. En produccion 0.
      LOG_LEVEL: ${LOG_LEVEL:-0}
      # Envio de correo (antes en la base de datos, ahora en config/config.php).
      # Por defecto apunta al servicio mail de aqui al lado; para un
      # servidor real, define estas variables en .env (ver .env.dev).
      EMAIL_METHOD: ${EMAIL_METHOD:-SMTP}
      EMAIL_SERVER: ${EMAIL_SERVER:-mail}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-mlsurvey}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-mlsurvey}
      EMAIL_FROM: ${EMAIL_FROM:-mlsurvey@example.test}
      # tls (STARTTLS), ssl, o none para SMTP sin cifrar (solo desarrollo).
      EMAIL_ENCRYPTION: ${EMAIL_ENCRYPTION:-none}
      # Captcha ALTCHA del formulario de codigo (ver .env.dev): sin HTTPS
      # ni localhost hay que ponerlo a false.
      ALTCHA_ENABLED: ${ALTCHA_ENABLED:-true}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:-}
      # Firma del extracto de formacion: autoridades de confianza y NIF de
      # los sellos admitidos, separados por comas.
      PDF_CA_FILE: ${PDF_CA_FILE:-certs/extracto_ca.pem}
      PDF_SIGNER_IDS: ${PDF_SIGNER_IDS:-S7800001E}
      # Documento que acredita el régimen (Clases Pasivas o resto): sello de MUFACE admitido,
      # antiguedad maxima del PDF y empresas publicas validas en la vida
      # laboral (listas separadas por comas).
      MUFACE_CA_FILE: ${MUFACE_CA_FILE:-certs/muface_ca.pem}
      MUFACE_SIGNER_IDS: ${MUFACE_SIGNER_IDS:-Q2861001B}
      PDF_MAX_AGE_DAYS: ${PDF_MAX_AGE_DAYS:-30}
      PDF_PUBLIC_EMPLOYERS: ${PDF_PUBLIC_EMPLOYERS:-COMUNIDAD DE MADRID CONSEJERIA DE EDUCACI,COMUNIDAD MADRID A.TERRITORIALES}
      # Administrador inicial: se crea al arrancar si no existe.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # true: cada usuaria solo gestiona las consultas que ha creado
      # (las administradoras, todas).
      SURVEY_EDIT_RESTRIC: ${SURVEY_EDIT_RESTRIC:-false}
    volumes:
      - uploads:/var/www/html/files
      # Para desarrollo, descomenta para editar el codigo sin reconstruir la imagen:
      - ./:/var/www/html
      # Sin esto, el montaje anterior tapa el vendor/ que instala composer
      # en la imagen (PHPMailer, HugeRTE) con el vendor/ local, vacio.
      - /var/www/html/vendor

volumes:
  db_data:
  uploads:
  mail_data:
